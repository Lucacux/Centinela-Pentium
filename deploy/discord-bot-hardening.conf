# Drop-in for /etc/systemd/system/discord-bot.service.d/hardening.conf
#
# The service account intentionally keeps only adm (journald/auth.log) and
# docker (current monitoring/restart API).  Docker remains a privileged trust
# boundary and should eventually move behind a constrained helper.
[Service]
User=centinela
Group=centinela
SupplementaryGroups=adm docker

StateDirectory=centinela
CacheDirectory=centinela
Environment=HOME=/var/lib/centinela
Environment=XDG_CACHE_HOME=/var/cache/centinela

# /home y /root quedan vacios para el servicio; los authorized_keys que
# alimentan el mapa fingerprint -> identidad se reexponen uno por uno y de solo
# lectura. Son claves PUBLICAS y el fingerprint ya viaja al journal en cada
# login; lo que no se concede es el directorio .ssh entero.
# Deben coincidir con SSH_KEY_DIRECTORY_FILES del .env.
BindReadOnlyPaths=-/home/luca/.ssh/authorized_keys
BindReadOnlyPaths=-/root/.ssh/authorized_keys

NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
PrivateTmp=yes
ProtectSystem=strict
# tmpfs y no yes: `yes` monta /home y /root como directorios inaccesibles de
# modo 000 y solo lectura, dentro de los cuales systemd no puede crear el punto
# de montaje de un BindReadOnlyPaths. Con el prefijo `-` esos binds se
# descartan en silencio y el bot se queda sin poder leer ningun authorized_keys
# aunque `systemctl show -p BindReadOnlyPaths` los siga listando. Con `tmpfs`
# el servicio ve un /home y un /root vacios y propios, mas exactamente los
# archivos que se le montan encima: el aislamiento de los home reales es el
# mismo y los binds funcionan.
ProtectHome=tmpfs
ProtectClock=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictRealtime=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RemoveIPC=yes
KeyringMode=private
UMask=0077

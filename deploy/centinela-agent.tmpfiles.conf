# /etc/tmpfiles.d/centinela-agent.conf
#
# Estado de contabilidad de CPU del agente remoto, entre un poll y el
# siguiente. Tiene que cumplir dos cosas a la vez que ningun directorio obvio
# cumple solo:
#
#   - morir con el host (un delta de CPU a traves de un reinicio no significa
#     nada), lo que descarta $HOME;
#   - sobrevivir al cierre de la sesion SSH, lo que descarta /run/user/$UID:
#     con Linger=no systemd lo borra ~10s despues de que el agente termina, y
#     cada poll vuelve a empezar de cero sin que falle nada visible.
#
# El usuario y el grupo los reescribe install-remote-agent.sh con el usuario
# real del agente.
d /run/centinela-agent 0700 luca luca -
